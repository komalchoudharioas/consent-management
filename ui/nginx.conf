# nginx config for the Consent Manager admin/subject SPA.
# - Serves static files from /usr/share/nginx/html.
# - Falls back to /index.html for unknown paths so React-router deep links
#   (e.g. /partners/abc, /consent/<request-id>) don't 404.
# - Has a `location /consent/v1/` that proxies to `consent-manager-api:8000` as
#   a convenience for docker-compose (backend container name on the shared
#   bridge network). In Kubernetes under Istio the host-level VirtualService routes /consent/ to
#   the backend Service before the request reaches this pod — so the block is
#   never hit in production.
# - `resolver 127.0.0.11` + `set $upstream …` keeps DNS resolution LAZY, so
#   nginx starts cleanly where the backend name doesn't resolve at boot (k8s).

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Lazy DNS — only used when a request actually hits /consent/.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Dev convenience only (docker-compose). Unreachable in k8s under Istio.
    #
    # Matches /consent/v1/ and NOT /consent/, deliberately: /consent/<request-id>
    # is a React-router route, and a prefix of /consent/ sends that deep link to
    # the API, which answers G2P-REQ-404. In-app navigation never hits nginx, so
    # only a pasted or redirected link shows it - which is exactly how a farmer
    # arrives at the consent screen.
    location /consent/v1/ {
        set $cm_backend "consent-manager-api:8000";
        proxy_pass http://$cm_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long cache for fingerprinted static assets (Vite emits hashed names).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # config.json is read at runtime — never cache it, so a redeploy/config
    # change (Keycloak URL, apiBaseUrl) is picked up immediately.
    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Anything else → SPA fallback. Prevents 404 on client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No-cache for index.html so clients always re-check after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
